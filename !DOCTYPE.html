<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>紙張噸價計算器</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            padding: 30px;
            width: 100%;
            max-width: 600px;
        }
        h2 {
            text-align: center;
            color: #2c3e50;
            border-bottom: 2px solid #3498db;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
            display: flex;
            align-items: center;
        }
        .form-group label {
            width: 120px;
            font-weight: bold;
        }
        .form-group input {
            flex: 1;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 16px;
        }
        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        .button-group button {
            flex: 1;
            padding: 12px;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 18px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .btn-calc {
            background-color: #3498db;
        }
        .btn-calc:hover {
            background-color: #2980b9;
        }
        .btn-clear {
            background-color: #e74c3c;
        }
        .btn-clear:hover {
            background-color: #c0392b;
        }
        .result-section {
            margin-top: 25px;
            background-color: #e8f4f8;
            padding: 20px;
            border-radius: 8px;
            border-left: 5px solid #3498db;
        }
        .result-item {
            margin-bottom: 10px;
            font-size: 16px;
        }
        .result-item span {
            font-weight: bold;
            color: #d35400;
            font-size: 18px;
        }
        .error {
            color: red;
            text-align: center;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>紙張噸價計算器</h2>

    <!-- 輸入區域 -->
    <div class="form-group">
        <label for="spec">規格名稱：</label>
        <input type="text" id="spec" placeholder="例如：銅版紙 (選填)">
    </div>
    <div class="form-group">
        <label for="length">長度：</label>
        <input type="number" id="length" step="0.01" placeholder="輸入長度">
    </div>
    <div class="form-group">
        <label for="width">寬度：</label>
        <input type="number" id="width" step="0.01" placeholder="輸入寬度">
    </div>
    <div class="form-group">
        <label for="ounce">盎司：</label>
        <input type="number" id="ounce" placeholder="輸入盎司數字 (例如 8)">
    </div>
    <div class="form-group">
        <label for="orderQty">客訂張數：</label>
        <input type="number" id="orderQty" placeholder="輸入客訂總張數">
    </div>
    <div class="form-group">
        <label for="unitPrice">客戶單張價：</label>
        <input type="number" id="unitPrice" step="0.0001" placeholder="輸入每張價格">
    </div>

    <!-- 按鈕區域 -->
    <div class="button-group">
        <button class="btn-calc" onclick="calculate()">開始計算</button>
        <button class="btn-clear" onclick="clearForm()">清除資料</button>
    </div>
    
    <div id="errorMsg" class="error"></div>

    <!-- 輸出區域 -->
    <div class="result-section" id="resultSection" style="display: none;">
        <div class="result-item">1. 張數 (查表)：<span id="resOunceSheet">0</span> 張</div>
        <div class="result-item">2. 一噸張數：<span id="resTonSheet">0</span> 張</div>
        <div class="result-item">3. 客訂重量：<span id="resWeight">0</span> kg</div>
        <div class="result-item">4. 客訂噸價：<span id="resTonPrice">0</span> 元/噸</div>
    </div>
</div>

<script>
    // 盎司對照表數據
    const ounceTable = {
        "8": 3760, "10": 3000, "12": 2480, "14": 2120, "16": 1880, "18": 1680,
        "20": 1500, "22": 1365, "24": 1240, "26": 1156, "28": 1060, "30": 1002,
        "32": 940, "34": 884, "36": 835, "38": 791, "40": 752, "42": 716,
        "44": 683, "46": 653, "48": 626, "50": 601, "52": 578, "54": 557,
        "56": 537
    };

    function calculate() {
        // 清空錯誤訊息
        document.getElementById('errorMsg').innerText = '';

        // 讀取輸入值
        const length = parseFloat(document.getElementById('length').value);
        const width = parseFloat(document.getElementById('width').value);
        const ounceInput = document.getElementById('ounce').value;
        const orderQty = parseFloat(document.getElementById('orderQty').value);
        const unitPrice = parseFloat(document.getElementById('unitPrice').value);

        // 基本防呆驗證
        if (!length || !width || !ounceInput || !orderQty || !unitPrice) {
            document.getElementById('errorMsg').innerText = '請填寫所有必要的數值（長、寬、盎司、客訂張數、客戶單張價）。';
            document.getElementById('resultSection').style.display = 'none';
            return;
        }

        if (width === 0 || length === 0) {
            document.getElementById('errorMsg').innerText = '長度與寬度不能為 0。';
            return;
        }

        // 1. 取得查表張數
        const ounceSheets = ounceTable[ounceInput];
        if (!ounceSheets) {
             document.getElementById('errorMsg').innerText = '找不到該盎司的對應張數，請檢查輸入的盎司數字是否在對照表中。';
             document.getElementById('resultSection').style.display = 'none';
             return;
        }

        // 2. 計算一噸張數
        const tonSheets = Math.floor((ounceSheets / length / width) * 936);

        // 3. 計算客訂重量
        let orderWeight = 0;
        if (tonSheets > 0) {
            orderWeight = Math.floor((orderQty / tonSheets * 1000) + 0.7);
        }

        // 4. 計算客訂噸價
        const tonPrice = Math.round(tonSheets * unitPrice);

        // 顯示結果
        document.getElementById('resOunceSheet').innerText = ounceSheets.toLocaleString();
        document.getElementById('resTonSheet').innerText = tonSheets.toLocaleString();
        document.getElementById('resWeight').innerText = orderWeight.toLocaleString();
        document.getElementById('resTonPrice').innerText = tonPrice.toLocaleString();
        
        // 顯示結果區塊
        document.getElementById('resultSection').style.display = 'block';
    }

    // 清除資料的函數
    function clearForm() {
        document.getElementById('spec').value = '';
        document.getElementById('length').value = '';
        document.getElementById('width').value = '';
        document.getElementById('ounce').value = '';
        document.getElementById('orderQty').value = '';
        document.getElementById('unitPrice').value = '';
        document.getElementById('errorMsg').innerText = ''; // 清除錯誤訊息
        document.getElementById('resultSection').style.display = 'none'; // 隱藏結果區塊
    }
</script>

</body>
</html>
